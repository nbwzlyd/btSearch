plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aifindres.lite'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aifindres.lite'
        minSdk 23
        targetSdk 28
        versionCode 14
        versionName '2.4'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        // x86_64 版 .so 只给 debug 用（本机模拟器验证），release 不带，避免包体变大
        debug {
            jniLibs.srcDirs = ['src/debug/jniLibs']
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // 边下边播：BT 引擎（.so 已手动解包到 src/main/jniLibs，只留纯 Java API jar）
    implementation files('libs/libtorrent4j-2.1.0-39.jar')
    // 视频播放器
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}

apply from: 'signing.gradle'
